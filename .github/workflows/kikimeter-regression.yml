name: Kikimeter regression (Windows)
on:
  push:
    branches:
      - refactor/amaliassistant-modernisation
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore tests/Kikimeter.Regression/Kikimeter.Regression.csproj
      - name: Build
        run: dotnet build tests/Kikimeter.Regression/Kikimeter.Regression.csproj --configuration ${{ matrix.configuration }} --no-restore
      - name: Run regression assertions
        run: dotnet run --project tests/Kikimeter.Regression/Kikimeter.Regression.csproj --configuration ${{ matrix.configuration }} --no-build --no-restore
